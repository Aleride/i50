          # --- 聊天 / 邮件：Minuet 1.0 Beta16（邮件+新闻+Telnet+Gopher+FTP，600K）---
          NET2 |  | https://files.mpoli.fi/software/dos/network/MINUET16.ZIP,https://files.mpoli.fi/software/dos/network/MINUARC.EXE
          # --- 命令行邮件：Barebones E-mail / TCPMAIL（POP3+SMTP，156K）---
          # 注意：这一组没有可确认的公开直链，下面几个是候选，下不到会打 !! 并跳过
          MAIL |  | https://www.cn-dos.net/newdos/dosware/tcpmaile.zip,https://www.cn-dos.net/newdos/dosware/barebone.zip,https://www.cn-dos.net/newdos/dosware/nettools.zip,https://files.mpoli.fi/software/dos/network/TCPMAIL.ZIP
          # --- 终端 / BBS：MS-DOS Kermit 3.16（内置 TCP/IP + Telnet，BSD 开源）---
