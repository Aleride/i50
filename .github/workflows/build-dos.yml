name: Build FreeDOS disks (network + IRC + browser)

# 网页手动触发：Actions → Build FreeDOS disks → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ==================== 欢迎页文字 ====================
  # 开机画面只有下面这两行，没有任何多余提示。
  #
  # 格式：
  #   1. "WELCOME: |" 这一行别动
  #   2. 内容每行开头必须是【10 个空格】，YAML 靠缩进认行
  #   3. 想让某行往里缩就多打空格，缩进会原样显示
  #   4. 只能用英文和 ASCII 符号（DOS 显示不了中文）
  #   5. 每行别超过 70 字符
  #
  # 想让两行分别贴在屏幕左右两端：在第一行后面补空格再接文字即可。
  # 改完重新跑一次 workflow 就生效，页面文件不用动。
  # =============================================================
  WELCOME: |
          Hi I50
          A DOS Computer
  # ==================== 预装 DOS 应用 ====================
  # 一行一个软件包：目录名 | 要收的文件 | 下载地址(逗号分隔多个备用源)
  # 同名目录会自动合并；全部自动加进 PATH 并写进 HELP。
  # 下载失败只跳过这一行，日志打 !!，不影响系统构建。
  # 每行开头至少 10 个空格；# 开头是注释。
  # =============================================================
  EXTRA: |
          # -- 文件管理器：Volkov Commander 4.05 英文版 (97 KB) --
          VC | VC.EXE VC.COM VC.HLP VC.CFG VC.INI | https://vc.vvv.kyiv.ua/download/vc405sw.zip,https://vc.vvv.kyiv.ua/download/vc49908a.zip
          # DosZip：开源双面板文件管理器，作为 VC 的备用
          VC | DOSZIP.EXE DOSZIP.HLP | https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.4/apps/doszip.zip,https://ftp.icm.edu.pl/packages/freedos/repositories/1.4/apps/doszip.zip
          # -- 压缩工具 --
          ZIP | PKZIP.EXE PKUNZIP.EXE ZIP.EXE UNZIP.EXE | https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.4/archivers/pkzip.zip,https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.4/archivers/pkunzip.zip,https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.4/archivers/zip.zip,https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.4/archivers/unzip.zip
