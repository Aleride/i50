          MOUSE | CTMOUSE.EXE CTMOUSE.COM | https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.4/base/ctmouse.zip,https://ftp.icm.edu.pl/packages/freedos/repositories/1.4/base/ctmouse.zip
          # -- 汇编器 / 调试器 --
          DEV | NASM.EXE NASM.COM | https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.4/devel/nasm.zip,https://ftp.icm.edu.pl/packages/freedos/repositories/1.4/devel/nasm.zip
          DEV | DEBUG.EXE DEBUG.COM | https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/repositories/1.4/base/debug.zip,https://ftp.icm.edu.pl/packages/freedos/repositories/1.4/base/debug.zip
