/* ============================================================
   米白老式机箱：斜面高光 / 压印 / 凹陷屏幕（1990s beige box）
   ============================================================ */
:root{
  --case:#e4e4d4;        /* 机身米白 */
  --case-hi:#f6f6ec;     /* 受光面 */
  --case-lo:#c8c9b5;     /* 背光面 */
  --hi:#ffffff;          /* 斜面高光 */
  --lo:#9a9b88;          /* 斜面暗边 */
  --line:#b5b6a2;
  --btn:#eaeade;
  --fg:#2f302a;          /* 深色字 */
  --dim:#6b6c60;
  --pwr:#2fbf6b; --hdd:#e8961e; --net:#2f74d0;
  --bevel: inset 1px 1px 0 rgba(255,255,255,.95),
           inset -1px -1px 0 rgba(105,106,92,.45),
           0 1px 2px rgba(0,0,0,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#d6d7c5;color:var(--fg);
 font:14px/1.4 system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
 overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100dvh;
 background:linear-gradient(160deg,var(--case-hi),var(--case) 45%,var(--case-lo));
 padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

/* ---------- 机箱前面板 ---------- */
#panel{display:flex;align-items:center;gap:9px;padding:8px 11px;flex:0 0 auto;
 background:linear-gradient(#f6f6ed,#dadbd0);
 border-bottom:2px solid var(--lo);
 box-shadow:inset 0 1px 0 #fff, 0 2px 5px rgba(0,0,0,.14)}
#power{width:38px;height:38px;flex:0 0 auto;border-radius:5px;
 background:linear-gradient(145deg,#f7f7ee,#d6d7c7);
 border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);
 box-shadow:var(--bevel);display:flex;align-items:center;justify-content:center;
 font-size:17px;color:#67685b}
#power:active,#panel button:not(#power):active{
 border-color:var(--lo) var(--hi) var(--hi) var(--lo);
 box-shadow:inset 2px 2px 4px rgba(0,0,0,.28);transform:translateY(1px)}
#power.on{color:#1a7a42;text-shadow:0 0 6px rgba(47,191,107,.5)}
/* 压印铭牌 */
/* 铭牌：拉丝铝框 + 四角沉头铆钉 + 内嵌黑色亚克力面板 */
.stamp{position:relative;display:flex;align-items:center;flex:0 0 auto;
 background:
   repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,rgba(0,0,0,.018) 1px 2px),
   linear-gradient(155deg,#eceee4 0%,#c4c5b3 38%,#dcdccf 62%,#adaf9f 100%);
 border:1px solid #8c8d7e;border-radius:2px;padding:4px 7px;line-height:0;
 box-shadow:inset 1px 1px 0 rgba(255,255,255,.95),
            inset -1px -1px 0 rgba(0,0,0,.30),
            0 1px 2px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.06)}
.stamp img{position:relative;z-index:1;display:block;width:auto;height:20px;
 background:#000;image-rendering:pixelated;border:1px solid #151513;border-radius:1px;
 box-shadow:inset 0 1px 3px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.38)}
/* 面板玻璃的斜向反光 */
.stamp::before{content:"";position:absolute;z-index:2;pointer-events:none;
 left:7px;right:7px;top:4px;bottom:4px;border-radius:1px;
 background:linear-gradient(158deg,rgba(255,255,255,.14) 0%,
            rgba(255,255,255,.03) 38%,transparent 55%)}
/* 四颗铆钉 */
.stamp::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
 background:
  radial-gradient(circle 1.6px at 3px 3px,#6f7062 0 55%,rgba(255,255,255,.85) 75%,transparent 100%),
  radial-gradient(circle 1.6px at calc(100% - 3px) 3px,#6f7062 0 55%,rgba(255,255,255,.85) 75%,transparent 100%),
  radial-gradient(circle 1.6px at 3px calc(100% - 3px),#6f7062 0 55%,rgba(255,255,255,.85) 75%,transparent 100%),
  radial-gradient(circle 1.6px at calc(100% - 3px) calc(100% - 3px),#6f7062 0 55%,rgba(255,255,255,.85) 75%,transparent 100%)}
/* 指示灯窗：嵌进面板的凹陷小槽，跟机箱冲压件一致 */
.leds{display:flex;gap:8px;flex:0 0 auto;align-items:center;
 background:linear-gradient(#e0e1d2,#f2f2e8);border-radius:3px;padding:5px 9px;
 border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);
 box-shadow:inset 1px 1px 3px rgba(0,0,0,.20),0 1px 0 #fff}
.led{display:flex;align-items:center;gap:4px;font:700 9px/1 ui-monospace,monospace;
 color:#86877a;text-shadow:1px 1px 0 #fff}
.led i{width:10px;height:10px;border-radius:2px;display:block;background:#b3b4a2;
 box-shadow:inset 1px 1px 2px rgba(0,0,0,.42),0 1px 0 #fff}
.led.pwr.on i{background:var(--pwr);box-shadow:0 0 7px var(--pwr),inset 0 0 2px #fff}
.led.pwr.blink i{animation:ledblink .5s steps(1,end) infinite}
@keyframes ledblink{
  0%,49%{background:var(--pwr);box-shadow:0 0 7px var(--pwr),inset 0 0 2px #fff}
  50%,100%{background:#b3b4a2;box-shadow:inset 1px 1px 2px rgba(0,0,0,.42),0 1px 0 #fff}
}
.led.pwr.err i{background:#d63a2c;box-shadow:0 0 7px #d63a2c,inset 0 0 2px #fff}
.led.hdd.on i{background:var(--hdd);box-shadow:0 0 7px var(--hdd),inset 0 0 2px #fff}
.led.net.on i{background:var(--net);box-shadow:0 0 7px var(--net),inset 0 0 2px #fff}
.sp{flex:1 1 auto}
#panel button:not(#power){flex:0 0 auto;
 background:linear-gradient(145deg,#f7f5ee,#dcd7ca);color:var(--fg);
 border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);
 box-shadow:var(--bevel);border-radius:4px;padding:6px 9px;font-size:14px;
 min-height:34px;touch-action:manipulation}

/* ---------- 显示器 ---------- */
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
 display:flex;align-items:center;justify-content:center;touch-action:none;
 background:radial-gradient(ellipse at 28% 18%,#f4f4ea,#dcdcd0 62%,#c8c9b7);
 border-top:2px solid #fff;border-bottom:2px solid var(--lo);
 box-shadow:inset 0 3px 8px rgba(255,255,255,.75),
            inset 0 -4px 10px rgba(0,0,0,.14)}
/* 显示器外框四角的沉头螺丝，纯装饰 */
#stage::before,#stage::after{content:"";position:absolute;z-index:2;pointer-events:none;
 width:9px;height:9px;border-radius:50%;
 background:radial-gradient(circle at 38% 34%,#f6f6ec,#a9aa98 62%,#7c7d6f);
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),0 1px 0 #fff;
 opacity:.55}
#stage::before{left:10px;top:10px}
#stage::after{right:10px;bottom:10px}

/* 显示器塑料外框（凸起斜面） */
#frame{position:relative;line-height:0;padding:13px;
 background:linear-gradient(145deg,#f5f5eb,#cfd0c1);border:2px solid;
 border-color:var(--hi) var(--lo) var(--lo) var(--hi);border-radius:9px;
 box-shadow:inset 2px 2px 3px #fff,inset -2px -2px 5px rgba(0,0,0,.18),
            0 5px 16px rgba(0,0,0,.3)}
#frame.rotated{background:none;border-color:transparent;box-shadow:none;padding:0}
#wrap{transform-origin:center center;transition:transform .12s ease-out}
#screen_container{background:#080a08;border-radius:4px;
 border:3px solid;border-color:#7c7d6f #fff #fff #7c7d6f;
 box-shadow:inset 0 0 20px rgba(0,0,0,.85),0 0 0 3px #e7e8d9}
#screen_container canvas{image-rendering:pixelated}
#hint{display:none!important;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
 background:linear-gradient(#fffef6,#e2e3d4);color:#4a463c;font-size:12px;font-weight:600;
 padding:7px 14px;border:2px solid;border-color:#fff var(--lo) var(--lo) #fff;
 border-radius:4px;box-shadow:0 3px 10px rgba(0,0,0,.25);
 display:none;white-space:nowrap;max-width:92vw}

/* ---------- 键盘条 ---------- */
#dock.hide{display:none}
#dock{flex:0 0 auto;padding:8px 9px calc(8px + env(safe-area-inset-bottom));
 background:linear-gradient(#f5f5eb,#d9dacd);
 border-top:2px solid #fff;
 box-shadow:inset 0 1px 0 #fff,0 -2px 5px rgba(0,0,0,.10)}
/* 隐藏输入框必须留在视口内且"可见"，否则手机浏览器拒绝弹软键盘 */
#kbd{position:fixed;left:0;top:0;width:2px;height:2px;padding:0;border:0;
 opacity:.01;font-size:16px;line-height:1;background:transparent;
 color:transparent;caret-color:transparent;pointer-events:none;z-index:0;
 -webkit-user-select:text;user-select:text}
/* 按键槽：整排键嵌在一条凹陷轨道里 */
#keys{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
 padding:4px;border-radius:4px;
 background:linear-gradient(#e5e6d7,#f1f1e7);
 border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);
 box-shadow:inset 1px 1px 3px rgba(0,0,0,.15),0 1px 0 #fff}
#keys::-webkit-scrollbar{display:none}
#keys button{flex:0 0 auto;min-width:46px;
 background:linear-gradient(145deg,#f9f9f0,#dbdcce);color:var(--fg);
 border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);
 box-shadow:var(--bevel);border-radius:4px;padding:8px 9px;font-size:13px;
 min-height:38px;touch-action:manipulation}
#keys button:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);
 box-shadow:inset 2px 2px 4px rgba(0,0,0,.28);transform:translateY(1px)}
#keys button.lit{background:linear-gradient(145deg,#cbd5dc,#aabcc4);color:#2a3a42}
#keys button.wide{min-width:64px}
#keys button.go{background:linear-gradient(145deg,#f4f4e4,#d8d9c3);
 color:#464535;font-weight:700;min-width:52px}

/* ---------- 弹出菜单 ---------- */
#menu{position:fixed;inset:0;z-index:70;background:rgba(58,54,46,.48);
 display:none;align-items:center;justify-content:center;padding:18px;overflow:auto}
#menu.on{display:flex}
#menu .box{background:linear-gradient(#f7f7ee,#dedfce);border:2px solid;

 padding:15px;width:min(360px,92vw);display:flex;flex-direction:column;gap:8px}
#menu h3{font-size:15px;font-weight:700;color:#35362e;

#menu h4{font-size:10px;color:#74756a;font-weight:700;margin-top:5px;

 padding-bottom:4px;border-bottom:1px dotted #c3c4b1}
#menu button{background:linear-gradient(145deg,#f9f9f0,#dbdcce);color:var(--fg);
 border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);
 box-shadow:var(--bevel);border-radius:4px;padding:11px 12px;font-size:14px;
 text-align:left;min-height:44px}
#menu button:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);
 box-shadow:inset 2px 2px 4px rgba(0,0,0,.28)}
#menu button.danger{background:linear-gradient(145deg,#e6e6d8,#cfd0bf);color:#55564a}

#menu .note{font-size:11px;color:#6b6c60;line-height:1.65;margin-top:2px;

 padding:8px 10px;border:2px solid;

 box-shadow:inset 1px 1px 3px rgba(0,0,0,.16),0 1px 0 #fff}
#menu select{background:#fffef6;color:var(--fg);border:2px solid;

 box-shadow:inset 1px 1px 3px rgba(0,0,0,.14);
 padding:10px;font-size:13px;width:100%;min-height:44px}
#menu input[type=text]{background:#fffef6;color:var(--fg);border:2px solid;
 border-color:var(--lo) var(--hi) var(--hi) var(--lo);border-radius:4px;
 box-shadow:inset 1px 1px 3px rgba(0,0,0,.14);
 padding:10px;font-size:13px;width:100%;min-height:44px;margin-top:2px}
#menu input[type=text]::placeholder{color:#9d9e90}

/* ---------- 关机（断电，保留深色） ---------- */
#off{position:fixed;inset:0;z-index:60;background:#171714;display:none;
 flex-direction:column;align-items:center;justify-content:center;gap:16px}
#off.on{display:flex}

#off button{background:linear-gradient(145deg,#f9f9f0,#dbdcce);color:var(--fg);
 border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);
 box-shadow:var(--bevel);padding:12px 26px;border-radius:4px;font-size:15px}

/* ---------- 网页全屏 ----------
   原生 Fullscreen：整个 #app（含面板、键盘条）一起进全屏；
   iOS Safari 不支持 Fullscreen API 时退到 .pfs 伪全屏（fixed 铺满 + 收起地址栏）。 */
html:fullscreen,body:fullscreen{background:#d6d7c5}
:fullscreen #app{height:100dvh}
body.pfs{overflow:hidden}
body.pfs #app{position:fixed;inset:0;z-index:50;height:100dvh;
 padding-top:env(safe-area-inset-top)}
#btn-fs.lit,#keys button.lit{background:linear-gradient(145deg,#cbd5dc,#aabcc4);color:#2a3a42}
#menu button.lit{background:linear-gradient(145deg,#cbd5dc,#aabcc4);color:#2a3a42}

/* ---------- 响应式 ---------- */
/* 手机专属紧凑布局：用 body.phone 判定，横放手机也保持竖屏结构 */
body.phone [data-act="rot"]{display:none!important}
body.phone #panel{gap:4px;padding:5px 6px}
body.phone .stamp{padding:3px 5px}
body.phone .stamp img{height:17px}
body.phone .stamp::before{left:5px;right:5px;top:3px;bottom:3px}
body.phone #power{width:32px;height:32px;font-size:15px}
body.phone #panel button:not(#power){padding:5px 8px;min-height:30px}
body.phone .leds{padding:3px 5px;gap:5px}
body.phone #frame{padding:4px;border-radius:6px}
body.phone #screen_container{border-width:2px;box-shadow:inset 0 0 14px rgba(0,0,0,.85),0 0 0 1px #e7e8d9}
body.phone #dock{padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
body.phone #keys{padding:3px}
body.phone #keys button{min-width:40px;padding:7px 6px;font-size:12px;min-height:34px}
body.phone #keys button.go{min-width:44px}
@media(min-width:1200px){ #panel{padding:9px 15px} }
/* 手机锁定竖屏；电脑保留旋转按钮与 hover 高亮 */
@media(hover:hover) and (pointer:fine){
  #panel button:not(#power):hover{background:linear-gradient(145deg,#fff,#e4e5d6)}
  #keys button:hover{background:linear-gradient(145deg,#fff,#e4e5d6)}
}
</style>
</head>

<script>
(function(){
"use strict";

/* ==============================================================
   FreeDOS 网络终端
   A: freedos-boot.img  (启动软盘)
   C: freedos-disk.img  (网卡驱动 + mTCP + 应用，可选)

   资源 100% 来自本仓库，不回退任何公共 CDN / 外部站点。
   缺任何一个必需文件 → 立刻红灯，不做任何补救尝试。

     必需  libv86.js  v86.wasm
           bios/seabios.bin  bios/vgabios.bin
           freedos-boot.img
     可选  freedos-disk.img（缺了就不挂 C: 盘）
   ============================================================== */

var LOCAL = {
  js:"libv86.js", wasm:"v86.wasm",
  bios:"bios/seabios.bin", vga:"bios/vgabios.bin"
};
var FDA_URL = "freedos-boot.img", FDA_SIZE = 737280;              /* A: 启动软盘 */
var HDA_URL = "freedos-disk.img", HDA_SIZE = 16 * 1024 * 1024;   /* C: 可选 */

var DEFAULT_RELAY = "wisps://wisp.mercurywork.shop";

var qs = new URLSearchParams(location.search);
var TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches)
            || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

var opt = {
  mem:  parseInt(qs.get("mem"),10) || (TOUCH ? 32 : 64),
  relay: qs.get("relay") !== null ? qs.get("relay") : DEFAULT_RELAY,
  cors:  qs.get("cors") || ""
};

var $ = function(i){ return document.getElementById(i); };
var wrap=$("wrap"), frame=$("frame"), stage=$("stage"), kbd=$("kbd");
var powerBtn=$("power"), offEl=$("off"), menuEl=$("menu"), nicSel=$("nic-select");
var ledPwr=$("led-pwr"), ledHdd=$("led-hdd"), ledNet=$("led-net");

var em=null, running=false, res={w:720,h:400};
var zoom=1, rot=0, fitMode=true;
/* 手机（窄屏触摸设备）永远竖屏，不允许把画面转 90°；
   电脑 / 宽屏平板保持原样，旋转按钮和状态记忆都在 */
function isPhone(){
  if(!TOUCH) return false;
  /* 用屏幕短边而不是视口宽度：手机横过来时也仍是手机 */
  var sw = window.screen.width  || window.innerWidth;
  var sh = window.screen.height || window.innerHeight;
  return Math.min(sw, sh) <= 600;      /* 手机 ≤500，平板 ≥768 */
}
function syncPhoneClass(){
  var ph = isPhone();
  document.body.classList.toggle("phone", ph);
  return ph;
}
syncPhoneClass();
function rotKey(){ return "v86-rot-" + (isPhone() ? "phone" : "wide"); }
try{
  rot = (localStorage.getItem(rotKey()) === "1" && !isPhone()) ? 90 : 0;
}catch(e){ rot = 0; }
var bootAt=0, ipsLast=0, ipsTime=0;
var hddTimer=null, netTimer=null;

function say(t){}
function on(el,cls){ el.classList.add(cls); }
function off(el,cls){ el.classList.remove(cls); }

/* 电源灯：加载中绿闪 / 就绪绿常亮 / 出错红常亮 / 关机灭 */
function pwrState(s){
  off(ledPwr,"on"); off(ledPwr,"blink"); off(ledPwr,"err");
  if(s==="boot")       { on(powerBtn,"on"); on(ledPwr,"blink"); }
  else if(s==="ready") { on(powerBtn,"on"); on(ledPwr,"on"); }
  else if(s==="error") { on(powerBtn,"on"); on(ledPwr,"err"); }
  else                 { off(powerBtn,"on"); }
}

/* ---------------- 资源探活：仅认本仓库文件 ---------------- */
function firstOk(list){
  return new Promise(function(res){
    var i=0;
    (function next(){
      if(i>=list.length){ res(null); return; }
      var u=list[i++];
      fetch(u,{method:"GET",headers:{Range:"bytes=0-0"},cache:"no-store"})
        .then(function(r){ r.ok ? res(u) : next(); })
        .catch(next);
    })();
  });
}
function loadScript(list){
  return new Promise(function(res,rej){
    var i=0;
    (function next(){
      if(i>=list.length){ rej(new Error("缺少仓库文件：libv86.js")); return; }
      var s=document.createElement("script");
      s.src=list[i++]; s.onload=function(){res();}; s.onerror=next;
      document.head.appendChild(s);
    })();
  });
}

/* ---------------- 屏幕自适应 ---------------- */
function fit(){
  var sc = $("screen_container");
  var w = sc.offsetWidth || res.w, h = sc.offsetHeight || res.h;
  if(!w || !h) return;
  var cw = stage.clientWidth - 6, ch = stage.clientHeight - 6;
  if(cw<=0 || ch<=0) return;
  // 手机锁定竖屏；电脑上横放与否完全由用户点「旋转」按钮决定
  if(isPhone()) rot = 0;
  // 手机上把显示器外框留白压到最小，让屏幕尽量铺满宽度
  var pad = rot ? 10 : (isPhone() ? 6 : 34);
  var aw = Math.max(80, cw - pad), ah = Math.max(80, ch - pad);
  var s = rot ? Math.min(aw/h, ah/w) : Math.min(aw/w, ah/h);
  zoom = Math.min(3.2, Math.max(0.3, s));
  applyTransform();
  $("btn-rot-top").classList.toggle("lit", !!rot);
  try{ localStorage.setItem(rotKey(), rot ? "1" : "0"); }catch(e){}
}
/* 旋转与自适应缩放 */
function applyTransform(){
  wrap.style.transform = "rotate("+rot+"deg) scale("+zoom.toFixed(3)+")";
  $("frame").classList.toggle("rotated", rot === 90);
}
function showHint(t){}   /* 真机不会弹提示，界面保持静默 */
addEventListener("resize", function(){ syncPhoneClass(); fit(); });
addEventListener("orientationchange", function(){ setTimeout(fit,300); });

/* ---------------- 开机 ---------------- */
function boot(){
  if(em){ try{ em.destroy(); }catch(e){} em=null; }
  running=false;
  pwrState("boot");
  offEl.classList.remove("on");

  Promise.all([
    firstOk([LOCAL.wasm]),
    firstOk([LOCAL.bios]),
    firstOk([LOCAL.vga ]),
    firstOk([FDA_URL]),
    firstOk([HDA_URL])
  ]).then(function(r){
    /* 必需资源缺一不可：缺了直接报错，不尝试任何外部替代 */
    var need = [
      ["v86.wasm",         r[0]],
      ["bios/seabios.bin", r[1]],
      ["bios/vgabios.bin", r[2]],
      ["freedos-boot.img", r[3]]
    ];
    for(var i=0;i<need.length;i++){
      if(!need[i][1]) throw new Error("缺少仓库文件：" + need[i][0]);
    }
    return loadScript([LOCAL.js]).then(function(){
      return {wasm:r[0], bios:r[1], vga:r[2],
              fda:FDA_URL, fdaSize:FDA_SIZE, hda:r[4]};
    });
  }).then(function(u){
    var o = {
      wasm_path:u.wasm,
      memory_size:opt.mem*1024*1024,
      vga_memory_size:2*1024*1024,
      screen_container:$("screen_container"),
      bios:{url:u.bios}, vga_bios:{url:u.vga},
      fda:{url:u.fda, size:u.fdaSize},
      autostart:true,
      boot_order:0x321           /* FLOPPY_HARDDISK_CD */
    };
    if(u.hda){
      o.hda = {url:u.hda, size:HDA_SIZE};
      // 服务器支持 HTTP Range 才按需加载，否则整盘下载
      o.hda.async = (window.__rangeOK === true);
    }
    if(opt.relay){
      o.net_device={type:"ne2k", relay_url:opt.relay};
      if(opt.cors) o.net_device.cors_proxy=opt.cors;
    }
    em = new V86(o);
    __saveRelay();
    wire(em);
  }).catch(function(e){
    pwrState("error");
    console.error("[I50] 启动失败：" + (e && e.message ? e.message : e));
    console.error("[I50] 请确认 Fetch v86 runtime 与 Build FreeDOS disks 都已跑出绿勾。");
  });
}

function wire(m){
  running = true;
  bootAt = Date.now(); ipsLast = 0; ipsTime = performance.now();
  m.add_listener("emulator-ready", function(){ pwrState("ready"); fit(); });

  m.add_listener("screen-set-size", function(a){
    res.w=a[0]; res.h=a[1];
    requestAnimationFrame(fit);
    fit();
  });

  m.add_listener("download-progress", function(e){
    var n=(e.file_name||"").split("/").pop();
    if(/wasm$/i.test(n)) return;
    say("载入 "+n+" "+(e.total?Math.round(e.loaded/e.total*100):0)+"%");
  });
  m.add_listener("download-error", function(e){
    pwrState("error"); console.error(e);
  });

  function hdd(){ on(ledHdd,"on"); clearTimeout(hddTimer);
    hddTimer=setTimeout(function(){ off(ledHdd,"on"); },90); }
  m.add_listener("ide-read-start", hdd);
  m.add_listener("ide-read-end",  hdd);
  m.add_listener("ide-write-end", hdd);

  function net(){ on(ledNet,"on"); clearTimeout(netTimer);
    netTimer=setTimeout(function(){ off(ledNet,"on"); },90); }
  m.add_listener("net0-send", net);
  m.add_listener("eth-transmit-end", net);
  m.add_listener("eth-receive-end", net);
}

/* ---------------- 关机 / 重启 ---------------- */
function shutdown(){
  if(em){
    if(em.stop){ try{ em.stop(); }catch(e){} }
    if(em.destroy){ try{ em.destroy(); }catch(e){} }
  }
  em=null; running=false;
  pwrState("off"); off(ledHdd,"on"); off(ledNet,"on");
  if(isFs()) exitFs();
  setTimeout(function(){ offEl.classList.add("on"); }, 350);
}
function reset(){
  offEl.classList.remove("on"); closeMenu();
  if(em){ try{ em.destroy(); }catch(e){} em=null; running=false; }
  boot();
}

/* ---------------- 网页全屏 ----------------
   注意：不用 v86 自带的 screen_go_fullscreen()——那个只把 canvas 铺满，
   会把机箱面板和键盘条一起丢掉，手机上就没法输入了。
   这里让整个网页进全屏，界面完整保留。 */
var pseudoFs = false;
function nativeFs(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function isFs(){ return nativeFs() || pseudoFs; }
function syncFsBtn(){
  var on = isFs();
  var b = $("btn-fs"); if(b) b.classList.toggle("lit", on);
  var m = document.querySelector('[data-act="m-fs"]');
  if(m) m.classList.toggle("lit", on);
}
function fitAfterFs(){
  syncFsBtn();                    /* 退出全屏时按钮高亮必须同步熄灭 */
  syncPhoneClass(); fit(); setTimeout(fit, 120); setTimeout(fit, 320);
}
function enablePseudoFs(){
  if(nativeFs()) return;
  pseudoFs = true;
  document.body.classList.add("pfs");
  try{ window.scrollTo(0, 1); }catch(e){}
  try{ window.scrollTo(0, 0); }catch(e){}
  fitAfterFs();
}
function goFs(){
  /* 手机上进全屏时尝试系统级竖屏锁定（Android Chrome 可能生效，iOS 静默失败） */
  if(isPhone() && screen.orientation && screen.orientation.lock){
    try{ var q=screen.orientation.lock("portrait"); if(q&&q.catch) q.catch(function(){}); }catch(e){}
  }
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen
        || document.body.requestFullscreen || document.body.webkitRequestFullscreen;
  if(fn){
    try{
      var r = fn.call(el);
      if(r && r.catch){
        r.catch(enablePseudoFs);
        setTimeout(function(){ if(!nativeFs()) enablePseudoFs(); }, 500);
      }else{
        setTimeout(function(){ if(!nativeFs()) enablePseudoFs(); }, 400);
      }
    }catch(e){ enablePseudoFs(); }
  }else{
    enablePseudoFs();
  }
  setTimeout(syncFsBtn, 60);
}
function exitFs(){
  if(nativeFs()){
    try{
      if(document.exitFullscreen) document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }catch(e){}
  }
  if(pseudoFs){ pseudoFs=false; document.body.classList.remove("pfs"); }
  fitAfterFs();
}
function toggleFs(){ isFs() ? exitFs() : goFs(); }
document.addEventListener("fullscreenchange", function(){ pseudoFs=false; fitAfterFs(); });
document.addEventListener("webkitfullscreenchange", function(){ pseudoFs=false; fitAfterFs(); });

/* ---------------- 键盘 ---------------- */
var SC={esc:[0x01],tab:[0x0F],enter:[0x1C],backspace:[0x0E],ctrl:[0x1D],alt:[0x38],shift:[0x2A],
 f1:[0x3B],f2:[0x3C],f3:[0x3D],f4:[0x3E],f5:[0x3F],f6:[0x40],f7:[0x41],f8:[0x42],
 f9:[0x43],f10:[0x44],f11:[0x57],f12:[0x58],
 home:[0xE0,0x47],end:[0xE0,0x4F],pgup:[0xE0,0x49],pgdn:[0xE0,0x51],del:[0xE0,0x53],
 up:[0xE0,0x48],down:[0xE0,0x50],left:[0xE0,0x4B],right:[0xE0,0x4D]};
function tap(c){
  if(!em||!running) return;
  em.keyboard_send_scancodes(c);
  setTimeout(function(){
    if(em&&running) em.keyboard_send_scancodes(c.map(function(x){return x===0xE0?0xE0:(x|0x80);}));
  },25);
}
function text(s){
  if(!em||!running||!s) return;
  if(typeof em.keyboard_send_text==="function"){ em.keyboard_send_text(s); return; }
  var out=[], m={" ":0x39,"\n":0x1C,".":0x34,"/":0x35,"-":0x0C,":":0x27};
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if(m[ch]!==undefined) out.push(m[ch]);
    else if(/[a-z]/.test(ch)) out.push(0x1E+ch.charCodeAt(0)-97);
    else if(/[A-Z]/.test(ch)) out.push(0x2A,0x1E+ch.toLowerCase().charCodeAt(0)-97);
    else if(/[0-9]/.test(ch)) out.push(ch==="0"?0x0B:0x02+ +ch-1);
  }
  if(out.length && running) em.keyboard_send_scancodes(out);
}
/* 在 DOS 里执行一条命令 */
function runCmd(cmd){
  if(!em||!running){ showHint("还没开机"); return; }
  showHint("执行: " + cmd);
  setTimeout(function(){ text(cmd); }, 60);
  setTimeout(function(){ tap([0x1C]); }, 260);
}
var caps=false;

/* ================================================================
   手机软键盘 → DOS
   之前这里只有 focus，输入进去的字符根本没人送给虚拟机，
   所以「点屏幕能弹输入法但打字没反应」。现在补齐整个链路：
     · input 事件 + 50ms 轮询双保险（各家输入法行为不一致）
     · composition 期间攒着，上屏后一次性取（中文会被过滤掉）
     · Enter / Backspace / Esc / Tab / 方向键走 keydown
     · 开机未完成时不丢字，等就绪后自动补发
   ================================================================ */
var composing=false;

function safeText(s){
  var out="";
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    /* DOS/CP437 只认可打印 ASCII；中文等非 ASCII 直接丢弃 */
    if(c===10||c===13||c===9||(c>=32&&c<=126)) out+=s.charAt(i);
  }
  return out;
}
function sendText(s){
  s=safeText(s);
  if(!s||!em||!running) return;
  try{ text(s); }catch(e){ console.error("[I50] 输入失败",e); }
}
function flushKbd(){
  if(composing || !kbd.value) return;
  if(!em || !running) return;        /* 还没开机：字符留着，稍后自动补发 */
  var v=kbd.value; kbd.value="";
  sendText(v);
}
kbd.addEventListener("input", flushKbd);
kbd.addEventListener("compositionstart", function(){ composing=true; });
kbd.addEventListener("compositionend", function(e){
  composing=false;
  var v=kbd.value || e.data || "";
  kbd.value="";
  sendText(v);
});
kbd.addEventListener("keydown", function(e){
  if(e.isComposing || e.keyCode===229) return;   /* 输入法组合中，别抢 */
  var k=e.key;
  if(k==="Enter"){
    e.preventDefault(); flushKbd(); tap([0x1C]); return;
  }
  if(k==="Backspace"){
    e.preventDefault();
    if(kbd.value) kbd.value=kbd.value.slice(0,-1);
    else tap([0x0E]);
    return;
  }
  var special={Escape:[0x01],Tab:[0x0F],ArrowUp:SC.up,ArrowDown:SC.down,
               ArrowLeft:SC.left,ArrowRight:SC.right};
  if(special[k]){ e.preventDefault(); flushKbd(); tap(special[k]); }
});
/* 兜底：某些手写/九宫格输入法不触发 input，只往 value 里塞字 */
setInterval(flushKbd, 50);

/* 唤起软键盘：必须在用户手势里同步调用，且元素要在视口内 */
function wakeKbd(){
  if(!TOUCH) return;
  try{ kbd.focus({preventScroll:true}); }catch(e){ try{ kbd.focus(); }catch(e2){} }
  try{ kbd.setSelectionRange(kbd.value.length,kbd.value.length); }catch(e){}
}
/* 按钮别抢走焦点，否则输入法会收起（mousedown 阻止聚焦，click 仍正常触发） */
document.addEventListener("mousedown", function(e){
  if(e.target && e.target.closest && e.target.closest("button")) e.preventDefault();
}, {passive:false});
document.addEventListener("pointerdown", function(e){
  if(e.target && e.target.closest && e.target.closest("button"))
    window.__kbWasFocused = (document.activeElement === kbd);
}, true);

/* ---------------- 鼠标 / 触摸 ---------------- */
var last=null,t0=0,moved=0;
function mouse(dx,dy,b){ if(em&&running&&em.mouse_send_event) em.mouse_send_event(dx,dy,b); }

stage.addEventListener("touchstart",function(e){
  wakeKbd();
  var t=e.touches[0]; last={x:t.clientX,y:t.clientY}; t0=Date.now(); moved=0;
},{passive:true});

stage.addEventListener("touchmove",function(e){
  if(e.touches.length!==1||!last) return;
  var t=e.touches[0], dx=Math.round(t.clientX-last.x), dy=Math.round(t.clientY-last.y);
  if(rot===90){ var tmp=dx; dx=-dy; dy=tmp; }
  last={x:t.clientX,y:t.clientY}; moved+=Math.abs(dx)+Math.abs(dy);
  mouse(dx,dy,0); e.preventDefault();
},{passive:false});

stage.addEventListener("touchend",function(e){
  if(e.touches.length===0){
    if(Date.now()-t0<250 && moved<12){ mouse(0,0,1); setTimeout(function(){mouse(0,0,0);},40); }
    last=null;
  }
});

stage.addEventListener("click",function(){
  if(TOUCH){ if(document.activeElement !== kbd) wakeKbd(); return; }
  if(em && !document.pointerLockElement && em.lock_mouse){
    try{ em.lock_mouse(); showHint("鼠标已锁定，按 Esc 解锁"); }catch(err){}
  }
});
document.addEventListener("pointerlockchange",function(){
  if(document.pointerLockElement) showHint("鼠标已锁定 · Esc 解锁");
});

function applyZoom(){ applyTransform(); }

/* ---------------- 菜单 ---------------- */
function openMenu(){
  // 若当前 relay 不是预设值，切到"自定义"并回填
  var known = false;
  for(var i=0;i<nicSel.options.length;i++){
    if(nicSel.options[i].value === opt.relay){ known = true; break; }
  }
  nicSel.value = known ? opt.relay : "__custom__";
  syncNicUI();
  menuEl.classList.add("on");
}
function closeMenu(){ menuEl.classList.remove("on"); }
menuEl.addEventListener("click",function(e){ if(e.target===menuEl) closeMenu(); });

function nicNote(r){
  if(r === "__custom__")
    return "填你自己搭的服务器地址，如 wisp://192.168.1.5:1234 或 wisps://your-worker.workers.dev";
  if(!r) return "网卡已拔出。";
  if(r.indexOf("wisp") === 0)
    return "全协议：网页(80)、BBS(23)、邮件(110/25)、IRC(6667) 都能用。公共节点，可能限速。";
  if(r.indexOf("ws") === 0)
    return "全协议：网页(80)、BBS(23)、邮件(110/25)、IRC(6667) 都能用。公共节点带宽较低（约 40KB/s）。";
  return "自定义后端。";
}
function syncNicUI(){
  var c = $("nic-custom");
  if(nicSel.value === "__custom__"){
    c.style.display = "block";
    c.value = (opt.relay && opt.relay !== "__custom__" &&
               /^(wisp|ws)s?:\/\//.test(opt.relay)) ? opt.relay : "";
  }else{
    c.style.display = "none";
  }
  $("nic-note").textContent = nicNote(nicSel.value);
}
nicSel.addEventListener("change",function(){
  if(nicSel.value === "__custom__"){
    syncNicUI(); $("nic-custom").focus(); return;   // 等用户填完再重启
  }
  opt.relay = nicSel.value;
  syncNicUI(); closeMenu(); boot();
});
$("nic-custom").addEventListener("keydown",function(e){
  if(e.key !== "Enter") return;
  var v = (this.value || "").trim();
  if(!v){ showHint("地址不能为空"); return; }
  opt.relay = v;
  closeMenu(); boot();
});

/* 记住上次的后端选择（同一台设备下次打开还用它） */
try{
  var saved = localStorage.getItem("v86-relay");
  // 只接受 wisp:// wisps:// ws:// wss:// 这几种，其他一律回退默认
  if(saved && /^(wisp|ws)s?:\/\/.+/.test(saved)) opt.relay = saved;
}catch(e){}
var __saveRelay = function(){
  try{ localStorage.setItem("v86-relay", opt.relay || ""); }catch(e){}
};

function shot(){
  if(!em||!em.screen_make_screenshot){ say("截图不可用"); return; }
  try{
    var img = em.screen_make_screenshot();
    var a=document.createElement("a");
    a.href = img.src || (img.toDataURL && img.toDataURL());
    a.download="freedos.png"; a.click();
    say("已截图");
  }catch(err){ say("截图失败"); }
}

/* ---------------- 按钮 ---------------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;

  if(b.id==="power"){
    if(running) openMenu();
    else { offEl.classList.remove("on"); boot(); }
    return;
  }
  if(b.dataset.cmd){ runCmd(b.dataset.cmd); return; }
  if(b.dataset.key){ tap(SC[b.dataset.key]||[]); return; }

  switch(b.dataset.act){
    case "fs":
    case "m-fs": closeMenu(); toggleFs(); break;
    case "menu": openMenu(); break;
    case "on": offEl.classList.remove("on"); boot(); break;

    case "cad": tap([0x1D]); tap([0x38]); tap([0xE0,0x53]); break;
    case "caps": caps=!caps; b.classList.toggle("lit",caps); tap([0x3A]); break;
    case "paste":
      if(navigator.clipboard&&navigator.clipboard.readText)
        navigator.clipboard.readText().then(text).catch(function(){ say("剪贴板被拒绝"); });
      else say("浏览器不支持粘贴");
      break;

    case "m-reset": reset(); break;
    case "m-cad": closeMenu(); tap([0x1D]); tap([0x38]); tap([0xE0,0x53]); break;
    case "m-shot": closeMenu(); shot(); break;
    case "rot":
    case "m-rot":
      if(isPhone()){ closeMenu(); return; }
      rot = rot ? 0 : 90; fitMode=false; fit();
      showHint(rot ? "屏幕已旋转 90°" : "屏幕已转正");
      closeMenu(); break;
    case "dock":
      $("dock").classList.toggle("hide");
      b.classList.toggle("lit", $("dock").classList.contains("hide"));
      setTimeout(fit, 30); break;
    case "m-fit": fitMode=true; rot=0; fit(); closeMenu(); break;
    case "m-off": closeMenu(); shutdown(); break;
    case "m-close": closeMenu(); break;
  }
  /* 敲功能键 / 快捷命令后，把输入法还给 DOS（菜单、关机、全屏除外） */
  var keepKb = !!(b.dataset.key || b.dataset.cmd) ||
               ["rot","dock","caps","cad","m-reset"].indexOf(b.dataset.act) >= 0;
  if(TOUCH && keepKb && !menuEl.classList.contains("on")) wakeKbd();
});

/* ---------------- 起飞 ---------------- */
// 先探测托管是否支持 HTTP Range，决定 C 盘是按需加载还是整盘下载
fetch(HDA_URL,{method:"GET",headers:{Range:"bytes=0-0"}})
  .then(function(r){ window.__rangeOK = (r.status === 206); })
  .catch(function(){ window.__rangeOK = false; })
  .then(boot);
})();
</script>
